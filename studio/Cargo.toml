[package]
name = "f103-studio"
description = "F103 Studio — отладочная студия для STM32F103C8T (Blue Pill) + FreeRTOS: справочник MCU, плата, UART-протокол, RTOS-монитор, SWD"
version = "0.1.11"
edition = "2021"
license = "MIT"

[[bin]]
name = "f103-studio"
path = "src/main.rs"

[dependencies]
# Newest egui line that builds on Rust 1.88–1.90 (eframe 0.34+ needs 1.92).
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_plot = "0.34"
egui_extras = "0.33"
serialport = { version = "4.7", default-features = false }
roxmltree = "0.20"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3.0.12"
